name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_DEFAULT_VERSION: "3.11"

# Token de solo lectura por defecto (principio de menor privilegio); los jobs
# que necesiten mas lo elevan explicitamente.
permissions:
  contents: read

jobs:
  # ==========================================
  # Code Quality
  # ==========================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy ruff

      - name: Lint with flake8
        run: |
          flake8 src/mztrain/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/mztrain/ --count --max-complexity=15 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: black --check --line-length 127 src/mztrain/

      - name: Check imports with isort
        run: isort --check-only --profile black --line-length 127 src/mztrain/

      - name: Type check with mypy
        run: mypy src/mztrain/ --ignore-missing-imports
        continue-on-error: true

      - name: Lint with ruff
        run: ruff check src/mztrain/

  # ==========================================
  # Tests
  # ==========================================
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.8"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src/mztrain --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests

  # ==========================================
  # Security
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Security scan with bandit (report, all severities)
        run: bandit -r src/mztrain/ -s B101 -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

      - name: Bandit gate (fail on HIGH severity)
        run: bandit -r src/mztrain/ -s B101 -lll

      - name: Check dependencies with safety
        run: safety check --full-report
        continue-on-error: true

  # ==========================================
  # Build
  # ==========================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ==========================================
  # Integrity seal
  # ==========================================
  seal-verify:
    name: Verify integrity seal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Verify cryptographic seal
        run: python scripts/seal.py verify

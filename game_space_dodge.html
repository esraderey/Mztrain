<!DOCTYPE html>
<html><head><title>Space Dodge - ZCodeBERT Generated</title>
<style>
*{margin:0;padding:0}
canvas{display:block;margin:20px auto;border:2px solid #88f;background:#000}
body{background:#0a0a0a;text-align:center;color:#ddd;font-family:Arial}
h1{margin:15px;color:#f0f}
#hud{font-size:20px;margin:10px;color:#0f0}
</style></head>
<body>
<h1>Space Dodge</h1>
<div id="hud">Score: 0 | Lives: 3</div>
<canvas id="g" width="700" height="400"></canvas>
<script>
const c=document.getElementById('g'),ctx=c.getContext('2d');
const W=700,H=400;
let player={x:W/2,y:H-60,w:30,h:40};
let asteroids=[];let particles=[];let stars=[];
let score=0,lives=3,gameOver=false,frame=0,speed=5;
let keys={};

// Generar estrellas de fondo
for(let i=0;i<60;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,
    s:Math.random()*2.5+0.5,b:Math.random()});
}

document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

function spawnAsteroid(){
  let size=20+Math.random()*25;
  asteroids.push({
    x:Math.random()*(W-size),y:-size,
    w:size,h:size,
    speed:1.5+Math.random()*1.5+score*0.002,
    rot:0,rotSpeed:(Math.random()-0.5)*0.1
  });
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    let angle=Math.random()*Math.PI*2;
    let spd=Math.random()*5+1;
    particles.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
      life:1,color,size:Math.random()*5+1});
  }
}

function update(){
  if(gameOver)return;
  frame++;

  // Mover jugador
  let spd=6;
  if(keys['ArrowLeft']||keys['a'])player.x-=spd;
  if(keys['ArrowRight']||keys['d'])player.x+=spd;
  if(keys['ArrowUp']||keys['w'])player.y-=spd*0.8;
  if(keys['ArrowDown']||keys['s'])player.y+=spd*0.8;
  player.x=Math.max(0,Math.min(W-player.w,player.x));
  player.y=Math.max(H*0.5,Math.min(H-player.h,player.y));

  // Spawn asteroides
  if(frame%40===0)spawnAsteroid();
  if(frame%500===0)speed+=0.15;

  // Mover asteroides
  for(let i=asteroids.length-1;i>=0;i--){
    let a=asteroids[i];
    a.y+=a.speed;a.rot+=a.rotSpeed;
    if(a.y>H+50){asteroids.splice(i,1);score++;continue;}

    // Colision
    if(player.x<a.x+a.w&&player.x+player.w>a.x&&
       player.y<a.y+a.h&&player.y+player.h>a.y){
      spawnParticles(player.x+player.w/2,player.y+player.h/2,'#f80',25);
      asteroids.splice(i,1);
      lives--;
      if(lives<=0){gameOver=true;}
    }
  }

  // Particulas
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.03;p.vy+=0.05;});
  particles=particles.filter(p=>p.life>0);

  // Estrellas
  stars.forEach(s=>{s.y+=s.s*0.7;if(s.y>H){s.y=0;s.x=Math.random()*W;}});

  document.getElementById('hud').textContent='Score: '+score+' | Lives: '+lives;
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Estrellas
  stars.forEach(s=>{
    ctx.fillStyle='rgba(255,255,255,'+(0.3+s.b*0.7)+')';
    ctx.fillRect(s.x,s.y,s.s,s.s);
  });

  // Asteroides
  asteroids.forEach(a=>{
    ctx.save();ctx.translate(a.x+a.w/2,a.y+a.h/2);ctx.rotate(a.rot);
    ctx.fillStyle='#999';
    ctx.beginPath();
    let sides=7;
    for(let i=0;i<sides;i++){
      let angle=(Math.PI*2/sides)*i;
      let r=a.w/2*(0.7+Math.random()*0.3);
      let px=Math.cos(angle)*r,py=Math.sin(angle)*r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
  });

  // Jugador (nave)
  ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);
  ctx.fillStyle='#0ff';
  ctx.beginPath();
  ctx.moveTo(0,-player.h/2);
  ctx.lineTo(-player.w/2,player.h/2);
  ctx.lineTo(0,player.h/3);
  ctx.lineTo(player.w/2,player.h/2);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#f80';
  ctx.fillRect(-8/2,player.h/4,8,10);
  // Motor encendido
  if(frame%4<2){
    ctx.fillStyle='#ff0';
    ctx.beginPath();ctx.moveTo(-8/3,player.h/2);
    ctx.lineTo(0,player.h/2+12+Math.random()*10);
    ctx.lineTo(8/3,player.h/2);ctx.fill();
  }
  ctx.restore();

  // Particulas
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Game Over
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f44';ctx.font='bold 40px Arial';
    ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-20);
    ctx.fillStyle='#ddd';ctx.font='22px Arial';
    ctx.fillText('Score: '+score,W/2,H/2+20);
    ctx.fillText('Press R to restart',W/2,H/2+50);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='r'&&gameOver){
    gameOver=false;score=0;lives=3;asteroids=[];particles=[];
    player.x=W/2;player.y=H-60;frame=0;speed=5;
  }
});

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script></body></html>
